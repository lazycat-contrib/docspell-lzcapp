version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: ghcr.io/docspell/restserver
build:
  toolchains: []
  run_buildscript: false
images:
  - id: restserver
    target: service
    service: restserver
    source: ghcr.io/docspell/restserver
    channel: stable
    sort: semver
    tag_regex: ^v[0-9]+[.][0-9]+[.][0-9]+$
    version_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    delivery:
      mode: mirror
      require_digest_match: true
  - id: joex
    target: service
    service: joex
    source: ghcr.io/docspell/joex
    channel: stable
    sort: semver
    tag_regex: ^v[0-9]+[.][0-9]+[.][0-9]+$
    version_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Docspell
    skip_if_version_exists: true
